
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMOND LEGEND | AL Season 01</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#070c09;color:white;
 font-family:Tahoma,Arial,sans-serif;
 background-image:radial-gradient(ellipse at top,#174329 0%,#070c09 65%);
}
header{
 text-align:center;padding:28px 10px;
 background:#080e0a;border-bottom:2px solid #39ff88;
}
.logo{
 color:#39ff88;font-size:clamp(27px,7vw,43px);
 font-weight:900;text-shadow:0 0 20px #39ff88;
}
.subtitle{color:#a8cdb5;margin-top:10px;font-size:12px}
main{max-width:950px;margin:auto;padding:15px}
.panel{
 background:#101a13;border:1px solid #28573a;
 border-radius:17px;padding:17px;margin-bottom:18px;
}
h2{color:#39ff88;font-size:19px;margin-top:0}
.center{text-align:center}
.pack{
 max-width:240px;margin:20px auto;padding:22px;
 border:2px solid #39ff88;border-radius:17px;
 background:linear-gradient(145deg,#174a2c,#080d09);
 box-shadow:0 0 25px #39ff8833;
}
.pack-icon{font-size:65px}
.pack-title{font-size:22px;color:#39ff88;font-weight:bold}
button{
 border:0;border-radius:10px;padding:13px 19px;
 background:#39ff88;color:#061109;font-weight:bold;
 font-size:15px;cursor:pointer;
}
button:active{transform:scale(.97)}
.secondary{background:#25382c;color:white}
.note{font-size:12px;color:#a5bbaa;line-height:1.9}
.cards{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:14px;
}
.player-card{
 overflow:hidden;position:relative;text-align:center;
 padding:8px;border-radius:14px;
 border:2px solid #39ff88;
 background:linear-gradient(150deg,#183523,#080b09 80%);
 box-shadow:0 0 13px #39ff8825;
 animation:show .35s ease;
}
.player-card.RARE{border-color:#58bfff;box-shadow:0 0 13px #58bfff33}
.player-card.LEGENDARY{
 border-color:#baff53;
 background:linear-gradient(150deg,#385b1e,#111a0c 65%,#070a07);
 box-shadow:0 0 23px #aaff5555,inset 0 0 15px #aaff5522;
}
.top{
 display:flex;justify-content:space-between;align-items:center;
 color:#39ff88;padding:4px 3px 8px;
}
.LEGENDARY .top{color:#d1ff80}
.rating{font-size:28px;font-weight:900}
.position{font-size:12px}
.photo-wrap{
 height:180px;overflow:hidden;border-radius:9px;
 background:radial-gradient(ellipse,#315c3c,#080b09);
}
.photo{
 width:100%;height:100%;object-fit:cover;
 object-position:center top;display:block;
}
.fallback{
 display:none;width:100%;height:100%;
 align-items:center;justify-content:center;font-size:55px;
}
.player-name{font-size:14px;font-weight:bold;margin:11px 2px;min-height:30px}
.rarity{
 padding:8px 2px;border-top:1px solid #39ff8866;
 color:#39ff88;font-size:11px;font-weight:bold;
}
.RARE .rarity{color:#72caff;border-color:#58bfff66}
.LEGENDARY .rarity{color:#d1ff80;border-color:#baff5388}
.empty{
 grid-column:1/-1;text-align:center;padding:20px;
 color:#9ab1a1;font-size:13px;
}
footer{text-align:center;padding:24px;color:#789482;font-size:11px}
@keyframes show{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<header>
 <div class="logo">⚽ ARMOND LEGEND</div>
 <div class="subtitle">AL SEASON 01 · BUILD YOUR LEGACY</div>
</header>

<main>
 <section class="panel center">
  <h2>🎁 پک بازیکنان</h2>
  <p>هر پک شامل دو کارت فوتبالی است!</p>
  <div class="pack">
   <div class="pack-icon">⚡</div>
   <div class="pack-title">NEON LEGEND PACK</div>
   <p class="note">دو شانس برای پیدا کردن اسطوره‌ها</p>
  </div>
  <button id="openPack">باز کردن پک ⚡</button>
  <p class="note">COMMON: 70% · RARE: 25% · LEGENDARY: 5%</p>
 </section>

 <section class="panel">
  <h2>✨ کارت‌های پک تو</h2>
  <div id="results" class="cards">
   <div class="empty">پک خودت را باز کن!</div>
  </div>
 </section>

 <section class="panel">
  <h2>📚 کلکسیون من</h2>
  <div id="collection" class="cards"></div>
  <p id="count" class="note center"></p>
  <button class="secondary" id="reset">پاک کردن کلکسیون آزمایشی</button>
 </section>
</main>

<footer>ARMOND LEGEND © AL SEASON 01</footer>

<script>
const players=[
 {id:"ronaldo",name:"کریستیانو رونالدو",rating:91,pos:"ST",rarity:"LEGENDARY",icon:"🐐",image:"images/ronaldo.jpg"},
 {id:"messi",name:"لیونل مسی",rating:92,pos:"RW",rarity:"LEGENDARY",icon:"🐐",image:"images/messi.jpg"},
 {id:"taremi",name:"مهدی طارمی",rating:87,pos:"ST",rarity:"LEGENDARY",icon:"🇮🇷",image:"images/taremi.jpg"},
 {id:"valverde",name:"فدریکو والورده",rating:89,pos:"CM",rarity:"RARE",icon:"🇺🇾",image:"images/valverde.jpg"},
 {id:"vinicius",name:"وینیسیوس جونیور",rating:90,pos:"LW",rarity:"RARE",icon:"🇧🇷",image:"images/vinicius.jpg"},
 {id:"yamal",name:"لامین یامال",rating:89,pos:"RW",rarity:"RARE",icon:"🇪🇸",image:"images/yamal.jpg"},
 {id:"rice",name:"دکلان رایس",rating:88,pos:"CDM",rarity:"COMMON",icon:"🏴",image:"images/rice.jpg"},
 {id:"griezmann",name:"آنتوان گریزمان",rating:88,pos:"CF",rarity:"COMMON",icon:"🇫🇷",image:"images/griezmann.jpg"},
 {id:"lautaro",name:"لائوتارو مارتینز",rating:89,pos:"ST",rarity:"RARE",icon:"🇦🇷",image:"images/lautaro.jpg"}
];

function drawPlayer(){
 const n=Math.random()*100;
 const rarity=n<5?"LEGENDARY":n<30?"RARE":"COMMON";
 const pool=players.filter(p=>p.rarity===rarity);
 return pool[Math.floor(Math.random()*pool.length)];
}

function makeCard(p){
 const card=document.createElement("article");
 card.className="player-card "+p.rarity;

 const top=document.createElement("div");
 top.className="top";
 const rating=document.createElement("span");
 rating.className="rating";
 rating.textContent=p.rating;
 const position=document.createElement("span");
 position.className="position";
 position.textContent=p.pos;
 top.append(rating,position);

 const wrap=document.createElement("div");
 wrap.className="photo-wrap";

 const img=document.createElement("img");
 img.className="photo";
 img.src=p.image;
 img.alt=p.name;
 img.onerror=()=>{
   img.style.display="none";
   fallback.style.display="flex";
 };

 const fallback=document.createElement("div");
 fallback.className="fallback";
 fallback.textContent=p.icon;
 wrap.append(img,fallback);

 const name=document.createElement("div");
 name.className="player-name";
 name.textContent=p.name;

 const rarity=document.createElement("div");
 rarity.className="rarity";
 rarity.textContent=p.rarity;

 card.append(top,wrap,name,rarity);
 return card;
}

function getCollection(){
 try{return JSON.parse(localStorage.getItem("armondCollection")||"[]")}
 catch{return []}
}

function saveCollection(c){
 localStorage.setItem("armondCollection",JSON.stringify(c));
}

function renderCollection(){
 const c=getCollection();
 const area=document.getElementById("collection");
 area.replaceChildren();
 if(!c.length){
  area.innerHTML='<div class="empty">هنوز کارتی نداری!</div>';
 }else{
  c.slice().reverse().forEach(p=>area.appendChild(makeCard(p)));
 }
 document.getElementById("count").textContent="تعداد کارت‌ها: "+c.length;
}

document.getElementById("openPack").onclick=()=>{
 const pulled=[drawPlayer(),drawPlayer()];
 const area=document.getElementById("results");
 area.replaceChildren();
 pulled.forEach(p=>area.appendChild(makeCard(p)));
 saveCollection(getCollection().concat(pulled));
 renderCollection();
};

document.getElementById("reset").onclick=()=>{
 if(confirm("کلکسیون آزمایشی پاک شود؟")){
  localStorage.removeItem("armondCollection");
  renderCollection();
  document.getElementById("results").innerHTML='<div class="empty">کلکسیون پاک شد!</div>';
 }
};

renderCollection();
</script>
</body>
</html>
